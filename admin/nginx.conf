server {
    listen 80;
    root /usr/share/nginx/html;

    # Same contract as the Vite dev proxy: /api/foo → server:8000/foo.
    location /api/ {
        proxy_pass http://server:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat streams over SSE: pass each event through as it's produced, and
        # allow slow local models a long time between tokens.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        client_max_body_size 100m;
    }

    # Client-side routing: every unknown path is the SPA.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
