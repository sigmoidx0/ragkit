name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest -q

  migrations:
    name: Migrations — round-trip on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ragkit
          POSTGRES_PASSWORD: ragkit
          POSTGRES_DB: ragkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragkit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ragkit:ragkit@localhost:5432/ragkit
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.7"
          enable-cache: true
      - run: uv sync --frozen
      # Up, all the way down, and up again: every migration has to apply to a
      # fresh database and be reversible — dev runs on SQLite, so this is the
      # only place Postgres-specific breakage would show.
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head

  admin:
    name: Admin UI — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [server, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f deploy/docker-compose.yml build
